openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: print-shop
    description: Print-shop order administration
  - name: booking-campaigns
    description: Booking campaign administration
paths:
  /booking/paypal/config:
    get:
      operationId: getBookingPayPalConfig
      tags: [booking-checkout]
      responses:
        "200":
          description: Public PayPal checkout configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingPayPalConfig"
  /booking/v2/checkout-holds/{bookingId}/paypal-status:
    post:
      operationId: getBookingDepositStatus
      tags: [booking-checkout]
      summary: Reconcile a receipt without starting a charge
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,200}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingCheckoutCredentials"
      responses:
        "200":
          description: Verified current payment state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingDepositStatusResult"
        "400": { description: Invalid request }
        "404": { description: Unknown checkout or token }
        "503": { description: Payment state unavailable }
  /booking/v2/checkout-holds/{bookingId}/paypal-capture:
    post:
      operationId: captureBookingDeposit
      tags: [booking-checkout]
      summary: Verify a PayPal deposit and atomically record it once
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,200}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingCheckoutCredentials"
      responses:
        "200":
          description: Verified payment, possibly requiring manual reconciliation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingDepositCaptureResult"
        "400": { description: Invalid request }
        "404": { description: Unknown checkout or token }
        "409": { description: Capture pending or payment mismatch }
        "410": { description: Unpaid checkout expired }
        "503": { description: Provider unavailable or reconciliation required }
  /booking/paypal/webhook:
    post:
      operationId: receiveBookingPayPalWebhook
      tags: [booking-checkout]
      summary: Verify PayPal signature before reconciling booking captures
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingPayPalWebhookEvent"
      responses:
        "200": { description: Processed or unrelated event }
        "400": { description: Invalid event }
        "401": { description: Invalid PayPal signature }
        "409": { description: Capture does not match the server order }
        "503": { description: "Provider unavailable, retry required" }
  /booking/v2/checkout-holds/{bookingId}/paypal-order:
    post:
      operationId: createBookingDepositOrder
      tags: [booking-checkout]
      summary: Create or resume a PayPal order using an owned checkout and its fixed deposit
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,200}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingCheckoutCredentials"
      responses:
        "200":
          description: Verified PayPal order, no payment captured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingDepositPayPalOrder"
        "400":
          description: Invalid input or deposit configuration
        "404":
          description: Unknown checkout or invalid token
        "409":
          description: Order creation pending, closed checkout, or campaign changed
        "410":
          description: Checkout expired
        "503":
          description: PayPal unavailable or order could not be verified
  /booking/v2/checkout-holds:
    post:
      operationId: createBookingCheckoutHold
      tags: [booking-checkout]
      summary: Reserve a slot for ten minutes before an immediate deposit checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingCheckoutHoldInput"
      responses:
        "201":
          description: Private booking draft reserved, no payment or confirmation email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingCheckoutHoldCreated"
        "400":
          description: Invalid input or campaign does not support immediate deposit checkout
        "404":
          description: Campaign not found
        "409":
          description: Slot occupied or campaign changed
        "503":
          description: Availability cannot be verified
  /booking/v2/checkout-holds/{bookingId}/resume:
    post:
      operationId: resumeBookingCheckoutHold
      tags: [booking-checkout]
      summary: Read an active checkout without extending its server deadline
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,200}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingCheckoutCredentials"
      responses:
        "200":
          description: Original deadline and server time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingCheckoutHoldView"
        "400":
          description: Invalid input
        "404":
          description: Unknown booking or invalid token
        "409":
          description: Checkout already closed
        "410":
          description: Checkout expired
  /booking/v2/checkout-holds/{bookingId}/release:
    post:
      operationId: releaseBookingCheckoutHold
      tags: [booking-checkout]
      summary: Abandon an owned checkout without cancelling a paid booking
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,200}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingCheckoutCredentials"
      responses:
        "200":
          description: Hold released or already expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingCheckoutHoldReleaseResult"
        "400":
          description: Invalid input
        "404":
          description: Unknown booking or invalid token
        "409":
          description: Checkout already consumed by a payment
  /shop/admin/catalog-products:
    post:
      operationId: createAdminCatalogProduct
      tags: [shop]
      summary: Create a catalog product and its private cost atomically
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCatalogProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogProductResult"
        "400":
          description: Invalid product fields
        "403":
          description: Administrator or passkey verification required
  /shop/admin/catalog-products/{id}:
    patch:
      operationId: updateAdminCatalogProduct
      tags: [shop]
      summary: Update catalog fields and private cost atomically
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCatalogProductInput"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogProductResult"
        "400":
          description: Invalid product fields
        "403":
          description: Administrator or passkey verification required
        "404":
          description: Product not found
        "409":
          description: Use the dedicated print catalog editor
    delete:
      operationId: deleteAdminCatalogProduct
      tags: [shop]
      summary: Delete an ordinary catalog product and its private cost atomically
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product and private cost deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogProductResult"
        "403":
          description: Administrator or passkey verification required
        "404":
          description: Product not found
        "409":
          description: Use the dedicated print catalog editor
  /shop/admin/catalog-products/reorder:
    put:
      operationId: reorderAdminCatalogProducts
      tags: [shop]
      summary: Reorder ordinary catalog products atomically
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCatalogProductReorder"
      responses:
        "200":
          description: Products reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogProductReorderResult"
        "400":
          description: Invalid product list
        "403":
          description: Administrator or passkey verification required
        "404":
          description: Product not found
        "409":
          description: Use the dedicated print catalog editor
  /admin/campaigns/{campaignId}/images/{imageKind}:
    post:
      operationId: uploadBookingCampaignImage
      tags: [booking-campaigns]
      summary: Upload a booking campaign cover image
      description: Admin-only binary image upload for the homepage slider or booking page. Accepts JPEG, PNG, or WebP images up to 5 MB.
      security:
        - bearerAuth: []
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9_-]+$'
          description: Existing campaign ID, or temp while creating a campaign.
        - name: imageKind
          in: path
          required: true
          schema:
            type: string
            enum: [slider, booking]
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Image stored in Firebase Storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignImageUploadResult"
        "400":
          description: Invalid campaign, image, or image kind
        "401":
          description: Authentication required
        "403":
          description: Admin access required
        "404":
          description: Campaign not found
        "413":
          description: Image exceeds the 5 MB limit
        "415":
          description: Unsupported or mismatched image format
        "500":
          description: Image could not be stored
  /lab-shipments/recent:
    get:
      operationId: getRecentLabShipments
      tags: [labs]
      summary: Recent confirmed sends to a laboratory
      description: Admin-only. Returns up to 100 actual sends, newest first; never assigns costs or jobs.
      security:
        - bearerAuth: []
      parameters:
        - name: labId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[^/]+$'
      responses:
        "200":
          description: Confirmed laboratory sends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecentLabShipment"
        "400":
          description: Invalid laboratory identifier
        "401":
          description: Authentication required
        "403":
          description: Admin access required
        "500":
          description: Shipment history unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /print-shop/admin/orders/{orderId}/customer-notifications/{kind}/resend:
    post:
      operationId: resendCustomerOrderNotification
      tags: [print-shop]
      summary: Resend a customer email for a print-order lifecycle event
      description: Admin-only. Resends an existing sent or failed notification; emails with an unresolved sending state cannot be retried.
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CustomerNotificationKind"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerOrderNotificationResendInput"
      responses:
        "200":
          description: Resend attempt completed or recorded as failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerOrderNotificationResendResult"
        "400":
          description: Invalid confirmation or notification kind
        "401":
          description: Admin authentication required
        "403":
          description: Admin access required
        "404":
          description: Print-shop order not found
        "409":
          description: The marker is unresolved or does not match the current event
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  schemas:
    BookingPayPalWebhookEvent:
      type: object
      additionalProperties: true
    BookingPayPalConfig:
      type: object
      required: [enabled, clientId, environment, currency]
      properties:
        enabled: { type: boolean }
        clientId: { type: ["string", "null"] }
        environment: { type: string, enum: [sandbox, live] }
        currency: { type: string, enum: [EUR] }
    BookingDepositStatusResult:
      type: object
      required: [bookingId, status, dataShootingInizio, dataShootingFine]
      properties:
        bookingId: { type: string }
        status: { type: string, enum: [unpaid, processing, paid, paid_action_required] }
        dataShootingInizio: { type: string, format: date-time }
        dataShootingFine: { type: string, format: date-time }
        payment:
          $ref: "#/components/schemas/BookingDepositCaptureResult"
    BookingDepositCaptureResult:
      type: object
      required: [bookingId, paypalOrderId, paypalCaptureId, status, amountCents, currency, duplicate, bookingConfirmed]
      properties:
        bookingId: { type: string }
        paypalOrderId: { type: string }
        paypalCaptureId: { type: string }
        status: { type: string, enum: [paid, paid_action_required] }
        amountCents: { type: integer, minimum: 1 }
        currency: { type: string, enum: [EUR] }
        paypalFeeCents: { type: integer, minimum: 0 }
        duplicate: { type: boolean }
        bookingConfirmed: { type: boolean }
    BookingDepositPayPalOrder:
      type: object
      required: [bookingId, paypalOrderId, depositAmountCents, currency, expiresAt]
      properties:
        bookingId: { type: string }
        paypalOrderId: { type: string }
        depositAmountCents: { type: integer, minimum: 1 }
        currency: { type: string, enum: [EUR] }
        expiresAt: { type: string, format: date-time }
    BookingCheckoutCustomer:
      type: object
      additionalProperties: false
      required: [nome, cognome, email, whatsapp]
      properties:
        nome: { type: string, minLength: 1, maxLength: 120 }
        cognome: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        whatsapp: { type: string, minLength: 8, maxLength: 50 }
    BookingCheckoutHoldInput:
      type: object
      additionalProperties: false
      required: [campaignId, cliente, dataShootingInizio, dataShootingFine]
      properties:
        campaignId: { type: string, minLength: 1, maxLength: 200, pattern: '^[^/]+$' }
        cliente:
          $ref: "#/components/schemas/BookingCheckoutCustomer"
        dataShootingInizio: { type: string, format: date-time }
        dataShootingFine: { type: string, format: date-time }
        prodottoId: { type: string, minLength: 1, maxLength: 200, pattern: '^[^/]+$' }
        note: { type: string, maxLength: 4000 }
    BookingCheckoutCredentials:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, pattern: '^[a-f0-9]{64}$' }
    BookingCheckoutHoldView:
      type: object
      required: [bookingId, campaignId, status, expiresAt, serverTime, depositAmountCents, currency, dataShootingInizio, dataShootingFine]
      properties:
        bookingId: { type: string }
        campaignId: { type: string }
        status: { type: string, enum: [active] }
        expiresAt: { type: string, format: date-time }
        serverTime: { type: string, format: date-time }
        dataShootingInizio: { type: string, format: date-time }
        dataShootingFine: { type: string, format: date-time }
        depositAmountCents: { type: integer, minimum: 1 }
        currency: { type: string, enum: [EUR] }
    BookingCheckoutHoldCreated:
      allOf:
        - $ref: "#/components/schemas/BookingCheckoutHoldView"
        - type: object
          required: [token]
          properties:
            token: { type: string }
    BookingCheckoutHoldReleaseResult:
      type: object
      required: [bookingId, status]
      properties:
        bookingId: { type: string }
        status: { type: string, enum: [cancelled, expired, payment_failed] }
    AdminCatalogProductResult:
      type: object
      required: [id]
      properties:
        id:
          type: string
    AdminCatalogProductReorder:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 200
            pattern: '^[^/]+$'
    AdminCatalogProductReorderResult:
      type: object
      required: [updated]
      properties:
        updated:
          type: integer
          minimum: 0
    AdminCatalogProductInput:
      type: object
      description: Fields to save; creation requires name, description, price, discount, photo count, category and active flag. Omitted cost is unchanged, null removes it.
      additionalProperties: false
      properties:
        nome:
          type: string
        descrizione:
          type: string
        prezzo:
          type: number
          minimum: 0
        sconto:
          type: number
          minimum: 0
          maximum: 100
        numeroFoto:
          type: integer
          minimum: 0
        categoria:
          type: string
        attivo:
          type: boolean
        immagini:
          type: array
          maxItems: 5
          items:
            type: string
        costoUnitario:
          type: [number, "null"]
          minimum: 0
        pesoGrammi:
          type: integer
          minimum: 0
        isBundle:
          type: boolean
        fotoCondivise:
          type: boolean
        prodottoSorgenteFotoId:
          type: string
        bundleItems:
          type: array
          items:
            $ref: "#/components/schemas/AdminCatalogBundleItem"
    AdminCatalogBundleItem:
      type: object
      additionalProperties: false
      required: [prodottoId, prodottoNome, quantita, numeroFoto]
      properties:
        prodottoId:
          type: string
        prodottoNome:
          type: string
        prodottoCategoria:
          type: string
        quantita:
          type: integer
          minimum: 1
        numeroFoto:
          type: integer
          minimum: 0
    CampaignImageUploadResult:
      type: object
      required: [downloadUrl, storagePath]
      properties:
        downloadUrl:
          type: string
          format: uri
        storagePath:
          type: string
      additionalProperties: false
    RecentLabShipment:
      type: object
      required: [id, labId, sentAt, sourceType, descrizione]
      properties:
        id:
          type: string
        labId:
          type: string
        jobId:
          type: string
        sentAt:
          type: string
          format: date-time
        sourceType:
          type: string
          enum: [job, photobook, print_shop]
        descrizione:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CustomerNotificationKind:
      type: string
      enum:
        - order_approved
        - manual_acceptance
        - order_confirmed
        - payment_confirmed
        - files_check
        - ready_to_print
        - sent_to_laboratory
        - printing
        - ready_for_pickup
        - delivered
        - cancelled
        - order_restored
    CustomerOrderNotificationResendInput:
      type: object
      properties:
        confirmed:
          type: boolean
          enum: [true]
      required: [confirmed]
      additionalProperties: false
    CustomerOrderNotificationResendResult:
      type: object
      properties:
        sent:
          type: boolean
        skipped:
          type: boolean
      required: [sent, skipped]
      additionalProperties: false

