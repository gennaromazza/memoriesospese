name: Image Studio Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "image-studio-desktop-v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/image-studio-desktop run typecheck
      - run: pnpm --filter @workspace/image-studio-desktop exec vitest run src/lib/uploadQueuePersistence.test.ts
      - run: pnpm --filter @workspace/image-studio-desktop exec vitest run electron/update-controller.test.mjs
      - run: pnpm --filter @workspace/image-studio-desktop run desktop:dist
        env:
          VITE_API_BASE_URL: https://imagestudiofotografico.com
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Check installer, launch, shortcuts and uninstall
        shell: pwsh
        run: ./artifacts/image-studio-desktop/scripts/smoke-installer.ps1
      - name: Package installer ZIP for manual download
        shell: pwsh
        run: |
          $folder = 'artifacts/image-studio-desktop/release'
          $version = (Get-Content artifacts/image-studio-desktop/package.json -Raw | ConvertFrom-Json).version
          $name = "Image-Studio-Gallerie-$version-x64"
          Compress-Archive -LiteralPath "$folder/$name.exe" -DestinationPath "$folder/$name.zip"
      - name: Verify updater metadata and checksums
        shell: pwsh
        run: ./artifacts/image-studio-desktop/scripts/verify-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: image-studio-windows-installer
          path: |
            artifacts/image-studio-desktop/release/*.exe
            artifacts/image-studio-desktop/release/*.zip
            artifacts/image-studio-desktop/release/*.exe.blockmap
            artifacts/image-studio-desktop/release/latest.yml
            artifacts/image-studio-desktop/release/SHA256SUMS.txt
          if-no-files-found: error

  publish-windows:
    # Temporary Actions artifacts are never an updater feed. Only an exact,
    # stable version tag may publish a public release, after Windows smoke checks.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/image-studio-desktop-v')
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require exact stable version tag
        shell: pwsh
        run: |
          $version = (Get-Content artifacts/image-studio-desktop/package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -cne "image-studio-desktop-v$version") {
            throw "Refuse test, mismatched or pre-release tags."
          }
      - run: node artifacts/image-studio-desktop/scripts/check-release-version.mjs
      - uses: actions/download-artifact@v4
        with:
          name: image-studio-windows-installer
          path: artifacts/image-studio-desktop/release
      - name: Recheck installer, ZIP, metadata and checksums
        shell: pwsh
        run: ./artifacts/image-studio-desktop/scripts/verify-release.ps1
      - name: Publish the checked release with installer and ZIP
        shell: pwsh
        run: |
          $folder = 'artifacts/image-studio-desktop/release'
          $installer = @(Get-ChildItem "$folder/Image-Studio-Gallerie-*-x64.exe")
          if ($installer.Count -ne 1) { throw "Missing checked installer." }
          $zip = [IO.Path]::ChangeExtension($installer[0].FullName, '.zip')
          gh release create $env:GITHUB_REF_NAME $($installer[0].FullName) "$($installer[0].FullName).blockmap" "$zip" "$folder/latest.yml" "$folder/SHA256SUMS.txt" --draft --verify-tag --title "Image Studio Gallerie $env:GITHUB_REF_NAME" --notes "Installer Windows non firmato: Windows potrebbe mostrare un avviso SmartScreen. ZIP con installer per download manuale; il file .exe separato serve all'aggiornamento automatico."
          if ($LASTEXITCODE -ne 0) { throw "Draft release creation failed." }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Release remains a draft; no update will be offered." }