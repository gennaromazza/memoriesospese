name: Image Studio Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "image-studio-desktop-v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @workspace/image-studio-desktop run typecheck
      - run: pnpm --filter @workspace/image-studio-desktop run desktop:dist
        env:
          VITE_API_BASE_URL: https://imagestudiofotografico.com
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Check installer, launch, shortcuts and uninstall
        shell: pwsh
        run: ./artifacts/image-studio-desktop/scripts/smoke-installer.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-studio-windows-installer
          path: artifacts/image-studio-desktop/release/*.exe
          if-no-files-found: error