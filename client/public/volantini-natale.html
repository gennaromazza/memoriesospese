<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Volantini Natale - Memorie Sospese</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Georgia", serif;
        background: linear-gradient(135deg, #c41e3a 0%, #8b1a2e 100%);
        padding: 20px;
        min-height: 100vh;
      }

      .controls {
        background: white;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }

      .controls h2 {
        margin-bottom: 10px;
        color: #c41e3a;
        font-weight: bold;
      }

      .controls p {
        color: #666;
        margin-bottom: 15px;
      }

      .controls button {
        background: linear-gradient(135deg, #c41e3a, #d4263b);
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        margin-right: 10px;
        margin-bottom: 10px;
        box-shadow: 0 3px 10px rgba(196, 30, 58, 0.4);
        transition: all 0.3s ease;
      }

      .controls button:hover {
        background: linear-gradient(135deg, #a61829, #c41e3a);
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(196, 30, 58, 0.6);
      }

      .filter-section {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 2px solid #f0f0f0;
      }

      .filter-section h3 {
        color: #c41e3a;
        margin-bottom: 15px;
        font-size: 18px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .filter-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .filter-btn {
        background: #f8f8f8;
        color: #333;
        border: 2px solid #e0e0e0;
        padding: 10px 20px;
        border-radius: 25px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.3s ease;
      }

      .filter-btn:hover {
        border-color: #c41e3a;
        color: #c41e3a;
        background: #fff;
      }

      .filter-btn.active {
        background: linear-gradient(135deg, #c41e3a, #d4263b);
        color: white;
        border-color: #c41e3a;
        box-shadow: 0 3px 10px rgba(196, 30, 58, 0.4);
      }

      /* Formato 9:16 (es: 1080x1920px) */
      .volantino {
        width: 540px;
        height: 960px;
        background: linear-gradient(180deg, #c41e3a 0%, #8b1a2e 50%, #c41e3a 100%);
        margin: 20px auto;
        position: relative;
        overflow: hidden;
        page-break-after: always;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      }

      /* Pattern di sfondo natalizio */
      .volantino::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image: 
          radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
          radial-gradient(circle at 90% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
          radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
        pointer-events: none;
      }

      /* Decorazioni natalizie - palline */
      .volantino::after {
        content: "";
        position: absolute;
        top: -50px;
        left: -50px;
        right: -50px;
        height: 200px;
        background: 
          radial-gradient(circle at 15% 40%, rgba(255, 215, 0, 0.3) 0%, transparent 5%),
          radial-gradient(circle at 85% 30%, rgba(255, 215, 0, 0.3) 0%, transparent 5%),
          radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.2) 0%, transparent 6%);
        pointer-events: none;
      }

      /* Fiocchi di neve animati */
      .snowflakes {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .snowflake {
        position: absolute;
        color: rgba(255, 255, 255, 0.4);
        font-size: 20px;
        animation: fall linear infinite;
      }

      @keyframes fall {
        0% {
          transform: translateY(-100px) rotate(0deg);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          transform: translateY(1000px) rotate(360deg);
          opacity: 0;
        }
      }

      .header {
        background: white;
        padding: 25px 30px;
        text-align: center;
        margin: 30px 30px 20px 30px;
        border-radius: 20px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        position: relative;
      }

      .header::before {
        content: "🎅";
        position: absolute;
        top: -30px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 50px;
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
      }

      .header h1 {
        color: #c41e3a;
        font-size: 24px;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 3px;
        font-weight: bold;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
      }

      .header p {
        color: #c41e3a;
        font-size: 16px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .content {
        background: white;
        margin: 0 30px;
        padding: 35px;
        border-radius: 20px;
        min-height: 500px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        border: 3px solid rgba(255, 255, 255, 0.3);
      }

      .product-name {
        color: #c41e3a;
        font-size: 30px;
        font-weight: bold;
        margin-bottom: 20px;
        text-align: center;
        line-height: 1.3;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
      }

      .product-description {
        color: #555;
        font-size: 18px;
        line-height: 1.6;
        margin-bottom: 30px;
        text-align: center;
      }

      .product-details {
        background: #fef9f5;
        padding: 25px;
        border-radius: 10px;
        margin-bottom: 25px;
        border-left: 5px solid #c94b4b;
      }

      .product-details .detail-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid #e0e0e0;
      }

      .product-details .detail-item:last-child {
        border-bottom: none;
      }

      .detail-label {
        color: #666;
        font-size: 16px;
      }

      .detail-value {
        color: #8b5a3c;
        font-size: 18px;
        font-weight: bold;
      }

      .price-box {
        background: linear-gradient(135deg, #c41e3a, #d4263b);
        color: white;
        padding: 30px;
        border-radius: 20px;
        text-align: center;
        margin-top: 30px;
        box-shadow: 0 6px 20px rgba(196, 30, 58, 0.5);
        border: 2px solid rgba(255, 255, 255, 0.2);
        position: relative;
        overflow: hidden;
      }

      .price-box::before {
        content: "⭐";
        position: absolute;
        top: 10px;
        left: 10px;
        font-size: 30px;
        opacity: 0.3;
      }

      .price-box::after {
        content: "⭐";
        position: absolute;
        bottom: 10px;
        right: 10px;
        font-size: 30px;
        opacity: 0.3;
      }

      .price-label {
        font-size: 18px;
        margin-bottom: 10px;
        opacity: 0.9;
      }

      .price {
        font-size: 48px;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .old-price {
        text-decoration: line-through;
        opacity: 0.7;
        font-size: 24px;
        margin-bottom: 10px;
      }

      .discount-badge {
        background: #fff;
        color: #c94b4b;
        padding: 8px 20px;
        border-radius: 20px;
        display: inline-block;
        font-weight: bold;
        font-size: 16px;
        margin-top: 10px;
      }

      .footer {
        text-align: center;
        color: white;
        padding: 30px;
        margin-top: 20px;
      }

      .footer .contact {
        font-size: 16px;
        margin-bottom: 10px;
      }

      .footer .website {
        font-size: 20px;
        font-weight: bold;
        color: #fef9f5;
      }

      .footer .cta {
        background: white;
        color: #8b5a3c;
        padding: 15px 30px;
        border-radius: 25px;
        display: inline-block;
        margin-top: 20px;
        font-weight: bold;
        font-size: 18px;
      }

      @media print {
        body {
          background: white;
          padding: 0;
        }
        .controls {
          display: none;
        }
        .volantino {
          margin: 0;
          box-shadow: none;
          page-break-after: always;
        }
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <h2>🎄 Generatore Volantini Natale 2024 🎄</h2>
      <p>
        Clicca per stampare o salva come PDF. Ogni prodotto sarà su una pagina
        separata in formato 9:16.
      </p>
      <button onclick="window.print()">🖨️ Stampa/Salva PDF</button>
      <button onclick="location.reload()">🔄 Ricarica</button>

      <div class="filter-section">
        <h3>🎯 Filtra per Categoria</h3>
        <div class="filter-buttons">
          <button class="filter-btn active" onclick="filterByCategory('all')" data-category="all">
            Tutti i Prodotti
          </button>
          <button class="filter-btn" onclick="filterByCategory('album')" data-category="album">
            📖 Album Fotografico
          </button>
          <button class="filter-btn" onclick="filterByCategory('stampe')" data-category="stampe">
            🖼️ Stampe
          </button>
          <button class="filter-btn" onclick="filterByCategory('digitale')" data-category="digitale">
            💾 File Digitali
          </button>
          <button class="filter-btn" onclick="filterByCategory('video')" data-category="video">
            🎥 Video
          </button>
          <button class="filter-btn" onclick="filterByCategory('pacchetto')" data-category="pacchetto">
            📦 Pacchetto Completo
          </button>
        </div>
      </div>
    </div>

    <div id="volantini-container">
      <!-- I volantini verranno generati qui dal JavaScript -->
    </div>

    <script type="module">
      // Stato del filtro
      let currentFilter = 'all';
      let allProducts = [];

      // Funzione filtro categoria
      window.filterByCategory = function(category) {
        currentFilter = category;
        
        // Aggiorna bottoni attivi
        document.querySelectorAll('.filter-btn').forEach(btn => {
          btn.classList.remove('active');
        });
        document.querySelector(`[data-category="${category}"]`).classList.add('active');
        
        // Rigenera volantini
        renderVolantini();
      };

      // Funzione per creare fiocchi di neve
      function createSnowflakes() {
        const positions = [
          { left: '10%', animationDuration: '8s', animationDelay: '0s' },
          { left: '25%', animationDuration: '10s', animationDelay: '2s' },
          { left: '40%', animationDuration: '9s', animationDelay: '1s' },
          { left: '60%', animationDuration: '11s', animationDelay: '3s' },
          { left: '75%', animationDuration: '7s', animationDelay: '1.5s' },
          { left: '90%', animationDuration: '9.5s', animationDelay: '2.5s' },
        ];

        let snowflakesHtml = '<div class="snowflakes">';
        positions.forEach(pos => {
          snowflakesHtml += `<div class="snowflake" style="left: ${pos.left}; animation-duration: ${pos.animationDuration}; animation-delay: ${pos.animationDelay}">❄️</div>`;
        });
        snowflakesHtml += '</div>';
        
        return snowflakesHtml;
      }

      // Funzione per creare un volantino
      function createVolantino(product) {
        const hasDiscount = product.sconto && product.sconto > 0;
        const prezzoOriginale = product.prezzo;
        const prezzoFinale = hasDiscount
          ? product.prezzoFinale
          : product.prezzo;

        return `
        <div class="volantino">
          ${createSnowflakes()}
          
          <div class="header">
            <h1>Christmas Shooting</h1>
            <p>By Image Studio</p>
          </div>

          <div class="content">
            ${
              product.immagini && product.immagini.length > 0
                ? `
              <div style="margin-bottom: 20px; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
                <img 
                  src="${product.immagini[0]}" 
                  alt="${product.nome}"
                  style="width: 100%; height: 200px; object-fit: cover;"
                />
              </div>
            `
                : ""
            }

            <div class="product-name">
              ${product.nome}
            </div>

            ${
              product.descrizione
                ? `
              <div class="product-description">
                ${product.descrizione}
              </div>
            `
                : ""
            }

            <div class="product-details">
              ${
                product.numeroFoto
                  ? `
                <div class="detail-item">
                  <span class="detail-label">📸 Numero Foto</span>
                  <span class="detail-value">${product.numeroFoto} foto</span>
                </div>
              `
                  : ""
              }
              
              <div class="detail-item">
                <span class="detail-label">📦 Categoria</span>
                <span class="detail-value">${getCategoriaLabel(product.categoria)}</span>
              </div>
            </div>

            <div class="price-box">
              <div class="price-label">Prezzo Speciale Natale</div>
              
              ${
                hasDiscount
                  ? `
                <div class="old-price">€${prezzoOriginale.toFixed(2)}</div>
              `
                  : ""
              }
              
              <div class="price">€${prezzoFinale.toFixed(2)}</div>
              
              ${
                hasDiscount
                  ? `
                <div class="discount-badge">-${product.sconto}% di sconto!</div>
              `
                  : ""
              }
            </div>
          </div>

          <div class="footer">
            <div class="contact">🎁 PRENOTAZIONI APERTE</div>
            <div class="website">memoriesospese.it</div>
            <div class="cta">🎄 Prenota il tuo Shooting Natalizio! 🎄</div>
          </div>
        </div>
      `;
      }

      function getCategoriaLabel(categoria) {
        const labels = {
          album: "Album Fotografico",
          stampe: "Stampe",
          digitale: "File Digitali",
          video: "Video",
          pacchetto: "Pacchetto Completo",
        };
        return labels[categoria] || categoria;
      }

      // Funzione rendering volantini con filtro
      function renderVolantini() {
        const container = document.getElementById("volantini-container");
        
        const filteredProducts = currentFilter === 'all' 
          ? allProducts 
          : allProducts.filter(p => p.categoria === currentFilter);

        if (filteredProducts.length === 0) {
          container.innerHTML = `
            <div class="controls">
              <h3 style="color: #c41e3a;">⚠️ Nessun prodotto in questa categoria</h3>
            </div>
          `;
          return;
        }

        let html = "";
        filteredProducts.forEach((product) => {
          html += createVolantino(product);
        });

        container.innerHTML = html;
      }

      // Carica i prodotti dal server
      async function loadProducts() {
        const container = document.getElementById("volantini-container");

        try {
          const response = await fetch('/api/products');
          
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }
          
          allProducts = await response.json();

          if (!allProducts || allProducts.length === 0) {
            container.innerHTML =
              '<div class="controls"><h3 style="color: #c41e3a;">⚠️ Nessun prodotto attivo trovato</h3></div>';
            return;
          }

          renderVolantini();
        } catch (error) {
          console.error("Errore caricamento prodotti:", error);
          container.innerHTML = `
          <div class="controls">
            <h3 style="color: #c41e3a;">❌ Errore caricamento prodotti</h3>
            <p>${error.message}</p>
          </div>
        `;
        }
      }

      // Carica i prodotti all'avvio
      loadProducts();
    </script>
  </body>
</html>
