<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <base href="%BASE_URL%" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <title>Image Studio - Il Tuo Studio Fotografico Digitale</title>
    <meta
      name="description"
      content="Benvenuto in Image Studio. Prenota il tuo servizio fotografico, visualizza le tue gallerie private, seleziona le tue foto preferite e condividi i momenti più belli. Il luogo dove i ricordi prendono vita."
    />

    <!-- Preconnect per Firebase Storage - accelera caricamento immagini -->
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" />
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com" />

    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Image Studio" />
    <meta
      property="og:description"
      content="Prenota servizi fotografici, accedi alle tue gallerie private, seleziona le tue foto preferite. Il luogo dove i ricordi prendono vita."
    />
    <meta property="og:image" content="assets/og-image.jpg" />
    <meta property="og:url" content="https://imagestudiofotografico.com" />
    <meta property="og:site_name" content="Image Studio" />
    <meta property="og:locale" content="it_IT" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Image Studio, fotografo matrimonio e eventi"
    />
    <meta
      name="twitter:description"
      content="Prenota servizi fotografici, accedi alle tue gallerie private, seleziona le tue foto preferite. Il luogo dove i ricordi prendono vita."
    />
    <meta name="twitter:image" content="assets/og-image.jpg" />

    <!-- Keywords SEO -->
    <meta
      name="keywords"
      content="studio fotografico, foto matrimonio, gallerie foto private, prenotazione fotografo, servizi fotografici, selezione foto, Image Studio, foto ricordi, fotografia professionale"
    />

    <!-- Author e brand -->
    <meta name="author" content="Image Studio" />
    <meta name="theme-color" content="#8B9A8B" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="src/main.tsx"></script>
    <script src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
