<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <base href="%BASE_URL%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Image Studio - Piattaforma Completa per Fotografi Professionisti</title>
    <meta name="description" content="Image Studio è la tua piattaforma all-in-one per la fotografia professionale: gestisci clienti, prenota servizi fotografici, condividi gallerie private, raccogli questionari e permetti ai tuoi clienti di selezionare le foto preferite. Il posto unico dove fotografi e clienti si incontrano." />

    <!-- Preconnect per Firebase Storage - accelera caricamento immagini -->
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" />
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com" />

    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Image Studio - Piattaforma Completa per Fotografi Professionisti" />
    <meta property="og:description" content="La piattaforma all-in-one per fotografi: gestione clienti, prenotazioni online, gallerie private, questionari e selezione foto. Il tuo studio fotografico digitale." />
    <meta property="og:image" content="assets/og-image.jpg" />
    <meta property="og:url" content="https://imagestudiofotografico.com" />
    <meta property="og:site_name" content="Image Studio" />
    <meta property="og:locale" content="it_IT" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Image Studio - Piattaforma Completa per Fotografi Professionisti" />
    <meta name="twitter:description" content="La piattaforma all-in-one per fotografi: gestione clienti, prenotazioni online, gallerie private, questionari e selezione foto. Il tuo studio fotografico digitale." />
    <meta name="twitter:image" content="assets/og-image.jpg" />

    <!-- Keywords SEO -->
    <meta name="keywords" content="studio fotografico, gestionale fotografi, prenotazioni fotografia, gallerie foto matrimonio, selezione foto clienti, piattaforma fotografi, gestione clienti fotografia, booking fotografo, questionario sposi, Image Studio" />
    
    <!-- Author e brand -->
    <meta name="author" content="Image Studio" />
    <meta name="theme-color" content="#8B9A8B" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="src/main.tsx"></script>
    <script src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
