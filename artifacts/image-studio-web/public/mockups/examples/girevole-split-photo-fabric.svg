<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Album girevole con copertina divisa tra foto e tessuto inciso</title>
  <desc id="desc">La metà sinistra mostra una fotografia, la metà destra un tessuto chiaro con un monogramma botanico.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eee9df"/>
      <stop offset="1" stop-color="#d8d0c3"/>
    </linearGradient>
    <pattern id="cloth" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 2h12M0 8h12M2 0v12M8 0v12" stroke="#9d8f7e" stroke-opacity=".28" stroke-width="1"/>
    </pattern>
    <linearGradient id="photo" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6f8d84"/>
      <stop offset=".48" stop-color="#c6a47d"/>
      <stop offset="1" stop-color="#334d4e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#4a4033" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g filter="url(#shadow)" transform="translate(250 120)">
    <rect width="700" height="470" rx="8" fill="#b99b70"/>
    <rect x="22" y="22" width="656" height="426" rx="4" fill="#f4efe6"/>
    <rect x="42" y="42" width="308" height="386" fill="url(#photo)"/>
    <path d="M42 320c72-100 128-40 179-94 50-53 91-23 129 36v166H42z" fill="#293f43" opacity=".65"/>
    <circle cx="197" cy="183" r="65" fill="#d8b382" opacity=".52"/>
    <rect x="350" y="42" width="308" height="386" fill="#c9bba7"/>
    <rect x="350" y="42" width="308" height="386" fill="url(#cloth)" opacity=".8"/>
    <g transform="translate(504 230)" fill="none" stroke="#624b37" stroke-width="5" stroke-linecap="round">
      <path d="M0 95c-8-55 1-105 30-152M1 54c-38-12-59-35-69-64M12 23c35-14 61-38 76-73M4-18c-8-27-5-50 8-70"/>
      <path d="M-52-25c-20-8-28-22-29-39 19 1 32 12 35 28M55-35c18-12 31-26 34-43-20 4-32 16-36 32M-8-95c13 7 21 18 21 33-16-6-24-17-21-33"/>
      <circle cx="0" cy="95" r="7" fill="#624b37"/>
    </g>
    <text x="504" y="370" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#624b37" letter-spacing="5">A · M</text>
  </g>
  <text x="600" y="690" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" fill="#29413f">Foto e tessuto con incisione</text>
</svg>